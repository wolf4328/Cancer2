      {

  {

          { text: "什麼都不做，等ta自己願意說", correct:false, death:"這段時間完全沉默，巨蟹座感覺你根本不在意ta過得怎樣，距離拉得更遠。" },
          { text: "傳一句你們以前喜歡的某樣東西——一首歌、一個梗，不提近況，就是傳過去", correct:true, trait:'P' },
          { text: "傳一句「最近有想到你，不用回我，就是想讓你知道」", correct:true, trait:'A' }
        ]
      },
      {
        scenario: "分手三週。ta按了你一則舊貼文的讚——是你們交往期間發的那一則。",
        options: [
          { text: "私訊ta「你有看到那則貼文」", correct:false, death:"點破ta的互動，巨蟹座感覺自己的一個小動作被你盯著，以後更不敢留痕跡。" },
          { text: "在那則貼文底下發一則新留言，想讓ta看到你的存在", correct:false, death:"在ta按讚的那則貼文操作，巨蟹座感覺你在刻意回應ta的訊號，壓迫感升起。" },
          { text: "什麼都不做，繼續過你的生活，不點破也不回應", correct:true, trait:'A' },
          { text: "幾天後發一則跟那則舊貼文有關的新內容，自然地延續，不是刻意的", correct:true, trait:'P' }
        ]
      }
    ]
  },
  {
    day: 9, stage: "挽回",
    variants: [
      {
        scenario: "分手一個月。共同朋友辦了一個小聚會，你和ta都在。ta今晚一直沒有主動跟你說話，但你注意到ta有幾次看向你。",
        options: [
          { text: "主動走過去找ta說話，把握機會", correct:false, death:"ta在觀察你，你立刻衝過去，巨蟹座感到被追，往人群裡躲。" },
          { text: "繼續跟其他人聊，讓ta繼續觀察你，不強迫任何互動", correct:true, trait:'P' },
          { text: "在ta旁邊的空位自然坐下，不特別找話題，就是在附近", correct:true, trait:'A' },
          { text: "在離開前走過去說「今天很高興見到你」，給ta一個收尾", correct:false, death:"「很高興見到你」讓剛才所有的自然都瞬間被定義成「你在等這個機會」，巨蟹座退後一步。" }
        ]
      },
      {
        scenario: "分手一個月。ta傳了一個你們以前喜歡的歌的連結，沒有說任何話。",
        options: [
          { text: "回「這首歌，你還記得」，想聊開", correct:false, death:"把ta的一個沉默動作轉成需要回應的話題，巨蟹座感覺被逼表態，開始後悔傳了。" },
          { text: "也傳一首歌回去，不說話，讓音樂繼續說", correct:true, trait:'P' },
          { text: "回一個聽歌的emoji，就這樣，接住ta的訊號但不放大", correct:true, trait:'A' },
          { text: "回「謝謝你想到我」，想讓ta知道你感受到了", correct:false, death:"「謝謝你想到我」把ta的動作定義成ta在主動靠近，巨蟹座感到被看穿，下次不敢再試探。" }
        ]
      }
    ]
  },
  {
    day: 10, stage: "挽回最終",
    variants: [
      {
        scenario: "分手兩個月。ta傳訊息「你最近過得怎樣」，就這樣，沒有前因後果。",
        options: [
          { text: "回「還好，你呢」，對等地問回去", correct:false, death:"對等式的回覆讓對話停在表面，巨蟹座感覺你沒有真的想讓這個對話走下去。" },
          { text: "回「最近還行，有時候還是會想到一些事。你傳這句話——是有什麼嗎」，溫柔地問", correct:true, trait:'E' },
          { text: "回「不算太好，但也在慢慢走。你呢，你這段時間怎麼樣」，真實回應，然後把話還給ta", correct:true, trait:'A' },
          { text: "回「還不錯，謝謝你問」，輕描淡寫", correct:false, death:"「謝謝你問」讓ta的主動變成一種禮貌行為，巨蟹座不知道怎麼繼續往下說。" }
        ]
      },
      {
        scenario: "分手兩個月。ta約你出來「只是喝個咖啡」。你到了，ta已經在等你了，看起來有點緊張。",
        options: [
          { text: "一坐下就說「你找我出來，是有想說什麼嗎」，直接問", correct:false, death:"逼ta馬上表態，巨蟹座還沒準備好就被推到聚光燈下，反而把話縮回去。" },
          { text: "先聊點輕鬆的，讓ta慢慢放鬆，等ta自己開口說想說的", correct:true, trait:'P' },
          { text: "說「你看起來有點緊張」，笑著說，讓ta知道你有注意到，氣氛反而鬆了", correct:true, trait:'E' },
          { text: "表現得很輕鬆自在，假裝這只是普通的朋友見面", correct:false, death:"過度輕鬆讓巨蟹座覺得你不把這次見面當一回事，鼓起勇氣來的ta開始懷疑自己是不是想太多。" }
        ]
      }
    ]
  }
];

const personas = {
  A: { name: "讓她覺得安全的人", desc: "你不逼、不急、不消失。巨蟹座的殼不是用說服打開的，是用時間和穩定的存在感讓ta自己選擇打開——而你剛好就是那種讓ta覺得「在這個人面前不需要防衛」的人。" },
  E: { name: "讓她覺得被懂的人", desc: "你看得出ta沒說出口的情緒，你先接住感受再說其他的。巨蟹座最怕被否定、被說「你想太多」，而你從來不這樣——你讓ta覺得自己的感受是合理的、是被在乎的。" },
  P: { name: "讓她自己走過來的人", desc: "你懂得節奏，你知道巨蟹座急不得，你讓ta在觀察你、試探你的過程裡，慢慢發現自己想靠近你。你沒有追，但ta走過來了——因為你讓ta覺得走過來是安全的。" }
};

let attemptNumber = 1;
let current = 0;
let alive = true;
let traitCounts = { A:0, E:0, P:0 };
let currentVariants = [];

function pickVariant(dayIdx){
  const vs = questions[dayIdx].variants;
  if(attemptNumber === 1) return vs[0];
  if(attemptNumber === 2) return vs[1];
  return vs[Math.floor(Math.random()*2)];
}

function initAttempt(){
  currentVariants = [];
  for(let i=0;i<questions.length;i++){
    currentVariants[i] = pickVariant(i);
  }
  const badge = document.getElementById('attemptBadge');
  if(attemptNumber > 1){
    badge.textContent = `第 ${attemptNumber} 次挑戰 · 情境已更新`;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function startQuiz(){
  attemptNumber = 1;
  current = 0;
  alive = true;
  traitCounts = { A:0, E:0, P:0 };
  initAttempt();
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quizWrap').classList.remove('hidden');
  renderQuestion();
}

function renderRoute(){
  const line = document.getElementById('routeLine');
  line.innerHTML = '';
  for(let i=0;i<questions.length;i++){
    const el = document.createElement('div');
    let cls = 'moonphase';
    if(i < current) cls += ' passed';
    else if(i === current && alive) cls += ' current';
    else if(i === current && !alive) cls += ' dead';
    el.className = cls;
    line.appendChild(el);
  }
}

function renderQuestion(){
  renderRoute();
  const q = questions[current];
  const v = currentVariants[current];
  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="day-header">
      <span class="day-tag">DAY ${q.day} / 10</span>
      <span class="stage-tag">${q.stage}</span>
    </div>
    <div class="scenario">${v.scenario}</div>
    <div class="options" id="opts">
      ${v.options.map((opt,i)=>`<button class="opt" data-i="${i}">${opt.text}</button>`).join('')}
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=> handleAnswer(parseInt(btn.dataset.i)));
  });
}

function handleAnswer(i){
  const v = currentVariants[current];
  const opt = v.options[i];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b=>b.disabled = true);

  if(opt.correct){
    buttons[i].classList.add('correct-flash');
    if(opt.trait) traitCounts[opt.trait]++;
    setTimeout(()=>{
      current++;
      if(current >= questions.length){
        alive = true;
        renderRoute();
        showResult(true);
      } else {
        renderQuestion();
      }
    }, 550);
  } else {
    buttons[i].classList.add('wrong-flash');
    alive = false;
    setTimeout(()=>{
      renderRoute();
      showResult(false, opt.death, questions[current].day);
    }, 650);
  }
}

function topTrait(){
  let best = 'A', bestVal = -1;
  for(const k in traitCounts){
    if(traitCounts[k] > bestVal){ bestVal = traitCounts[k]; best = k; }
  }
  return best;
}

function showResult(success, deathLine, dayReached){
  const card = document.getElementById('card');
  if(success){
    const p = personas[topTrait()];
    card.innerHTML = `
      <div class="result-screen">
        <div class="day-tag" style="color:var(--tide-light)">挑戰完成</div>
        <div class="result-days">10<span> / 10 天</span></div>
        <div class="result-title">月亮終於圓滿了 🌕</div>
        <div class="result-persona">你的類型：${p.name}</div>
        <div class="result-desc">${p.desc}</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="restart()">再挑戰一次</button>
        </div>
      </div>
    `;
  } else {
    card.innerHTML = `
      <div class="result-screen">
        <div class="day-tag" style="color:var(--danger-light)">潮水退去</div>
        <div class="result-days">${dayReached - 1}<span> / 10 天</span></div>
        <div class="result-title">你在第 ${dayReached} 天讓潮水退去了</div>
        <div class="result-desc">${deathLine}</div>
        <div class="retry-hint">下一次的情境會有變化 · 別靠記憶</div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="restart()">重新挑戰</button>
        </div>
      </div>
    `;
  }
}

function restart(){
  attemptNumber++;
  current = 0;
  alive = true;
  traitCounts = { A:0, E:0, P:0 };
  initAttempt();
  renderQuestion();
}
</script>
